name: Bug report
description: A script, the scope guard or the skill does something it should not, or refuses something it should do.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you paste output, take out anything private:
        local paths, your user name, private repo or app names, session ids,
        ledger lines and commit shas of private repos. A placeholder such as
        `<repo>` or `<path>` is fine.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - a script (scripts/)
        - the scope guard (hooks/)
        - the skill or a template (skills/, templates/)
        - the tests (tests/)
        - the docs (README, CHANGELOG)
        - not sure
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Script, hook or file
      description: For example `coord-status.ps1 -Verify` or `merge-verify.ps1`.
  - type: input
    id: version
    attributes:
      label: tracksteward version
      description: The `version` in `.claude-plugin/plugin.json`, or a commit of this repo.
      placeholder: 0.2.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS, PowerShell host and version (`$PSVersionTable.PSVersion`), `git --version`,
        `gh --version`, and the Claude Code version if the scope guard or the skill is involved.
        Windows PowerShell 5.1 on Windows is the only verified host.
      placeholder: |
        Windows 11, Windows PowerShell 5.1
        git 2.47
        gh 2.60
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order, and the ledger or repo state they need.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual, with the output
      description: The output and exit code, scrubbed of private content as above.
      render: text
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test run (optional)
      description: The `RUN:` line of `tests\run.ps1`, or the summary line of the suite that covers the script.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The output above holds no private paths, names, session ids or shas.
          required: true
