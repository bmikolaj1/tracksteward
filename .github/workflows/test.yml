# Runs the test suites (tests\run.ps1) on Windows PowerShell 5.1, the one host
# the scripts are verified on.
#
# Triggers: pull requests and a manual run only (no push, no schedule). The
# repository is public; this file claims no Actions billing or minutes rule.
#
# The suites run as one parallel job per group (tests\run.ps1 -Group; the group
# table lives in run.ps1, and every suite is in exactly one group, a new one in
# 'rest'). A group name listed here that run.ps1 does not know fails its job, and
# tests\run.test.ps1 checks that this matrix names every group run.ps1 has.
#
# The scrub suite's private denylist is not in this repo and not on the runner.
# With TRACKSTEWARD_SCRUB_DENYLIST unset and no -History range the suite skips
# its denylist rows with an UNCHECKED "NOT CHECKED: denylist absent" line; a set
# variable or a -History run fails without the denylist.
# TRACKSTEWARD_SKIP_TIMING=1 skips the guard suite's G9 timing rows (SKIP lines,
# not passed); a local run without it keeps them. No secret is set here.
name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-ps1:
    name: tests\run.ps1 ${{ matrix.group }} (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [prepush, prune, guard-merge, rest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versions
        shell: powershell
        run: |
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          git --version

      - name: tests\run.ps1 (group ${{ matrix.group }})
        shell: powershell
        env:
          # The guard suite's G9 timing rows have fixed budgets that a hosted
          # runner misses; they print a SKIP line each and do not count as passed.
          TRACKSTEWARD_SKIP_TIMING: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run.ps1 -Shell powershell -Group ${{ matrix.group }}
          exit $LASTEXITCODE
